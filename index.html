<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Планировщик трат</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Форма входа -->
  <div id="loginBox" class="card login-card">
    <h2>Вход</h2>
    <div class="field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="username">
    </div>
    <div class="field">
      <label for="loginPassword">Пароль</label>
      <input type="password" id="loginPassword" placeholder="••••••" autocomplete="current-password">
    </div>
    <button id="loginBtn" class="btn-primary">Войти</button>
    <div id="loginError" class="error-text"></div>
  </div>

  <!-- Основной интерфейс -->
  <div id="appBox" class="wrap" hidden>
    <header class="app-header">
      <div>
        <h1>Планировщик трат</h1>
        <div class="subtitle">План и факт по статьям, автоматический баланс и остаток</div>
      </div>
      <button id="logoutBtn" class="btn-ghost">Выйти</button>
    </header>

    <div id="syncStatus" class="sync-status">Синхронизация с облаком...</div>

    <div class="card">
      <div class="period-row">
        <div class="field field-grow">
          <label for="period">Период</label>
          <input type="text" id="period">
        </div>
        <div class="field field-start">
          <label for="startBalance">Остаток на начало</label>
          <input type="number" id="startBalance" step="0.01">
        </div>
      </div>

      <div class="summary">
        <div class="stat"><div class="label">Остаток (план)</div><div class="value" id="planRemainder">—</div></div>
        <div class="stat"><div class="label">Остаток (факт)</div><div class="value" id="factRemainder">—</div></div>
        <div class="stat"><div class="label">План всего</div><div class="value" id="planTotal">—</div></div>
        <div class="stat"><div class="label">Факт всего</div><div class="value" id="factTotal">—</div></div>
      </div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Статья расхода</th>
            <th class="num">План</th>
            <th class="num">Факт</th>
            <th class="num">Баланс</th>
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <div class="actions">
        <button class="icon-btn add" id="addRow" title="Добавить статью">+</button>
        <button id="resetFacts">Очистить факт</button>
        <button class="btn-danger" id="resetAll">Удалить все строки</button>
      </div>

      <p class="hint">Баланс = План − Факт. Если факт не заполнен — показывается «операции по статье ещё не было».</p>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
